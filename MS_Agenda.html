<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda de Eventos - Učenici hrvatskog jezika</title>
    <style>
        :root {
            --croatia-blue: #0051ba;
            --croatia-red: #d90f13;
            --white: #ffffff;
            --dark-bg: #1b264f;
        }

        body {
            margin: 0;
            padding: 10px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), 
                        url('imagenes/Bandera-Croacia.avif') no-repeat center center fixed;
            background-size: cover;
            background-color: var(--dark-bg);
            color: #222;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Perfil flotante idéntico al de tus otras páginas */
        .user-floating-badge {
            position: fixed;
            top: 12px;
            left: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(27, 38, 79, 0.85);
            padding: 4px 10px 4px 4px;
            border-radius: 30px;
            border: 2px solid var(--croatia-blue);
            backdrop-filter: blur(8px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            z-index: 1000;
            display: none;
        }

        .user-avatar-mini {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #ffffff;
            background: #cbd5e1;
        }

        .user-name-mini {
            color: #ffffff;
            font-size: 0.8rem;
            font-weight: bold;
            text-shadow: 0 1px 2px rgba(0,0,0,0.5);
            padding-right: 4px;
        }

        .agenda-container {
            width: 100%;
            max-width: 1300px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            border: 4px solid var(--croatia-blue);
            padding: 25px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 20px;
            position: relative;
            margin-top: 30px;
        }

        .agenda-header {
            position: relative;
            text-align: center;
            background: linear-gradient(135deg, rgba(0, 81, 186, 0.95), rgba(27, 38, 79, 0.95));
            backdrop-filter: blur(8px);
            border-radius: 12px;
            padding: 18px 30px;
            width: 100%;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            border: 2px solid rgba(255, 255, 255, 0.9);
            box-sizing: border-box;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .badge-idioma {
            position: absolute;
            top: 15px;
            left: 20px;
            background: var(--croatia-red);
            color: white;
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 800;
            letter-spacing: 0.5px;
            border: 1px solid rgba(255,255,255,0.6);
            cursor: pointer;
            transition: transform 0.1s, background 0.2s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            z-index: 20;
        }

        .badge-idioma:hover {
            background: #b50b0f;
            transform: scale(1.05);
        }

        .agenda-header h1 {
            margin: 0 auto;
            color: var(--white);
            font-size: 1.8rem;
            font-weight: 800;
            text-shadow: 0 2px 5px rgba(0,0,0,0.6);
        }

        .header-actions {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .btn-admin {
            background: #10b981;
            color: var(--white);
            border: 2px solid #059669;
            padding: 8px 16px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            display: none; 
            align-items: center;
            gap: 6px;
            font-size: 0.9rem;
        }

        .btn-admin:hover {
            background: #059669;
            transform: translateY(-2px);
        }

        .btn-editar-card {
            background: #f59e0b;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 0.8rem;
            cursor: pointer;
            margin-right: 5px;
            font-weight: bold;
        }

        .btn-eliminar-card {
            background: #ef4444;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 0.8rem;
            cursor: pointer;
            font-weight: bold;
        }

        .admin-controls-card {
            margin-top: 10px;
            display: none;
        }

        .btn-volver {
            background: #64748b;
            color: var(--white);
            border: 2px solid var(--white);
            padding: 8px 18px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .btn-volver:hover {
            background: #475569;
            transform: translateY(-2px);
        }

        .featured-event-box {
            background: linear-gradient(135deg, rgba(0, 81, 186, 0.08), rgba(217, 15, 19, 0.08));
            border: 2px dashed var(--croatia-blue);
            border-radius: 12px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .featured-badge {
            background: var(--croatia-red);
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
            width: fit-content;
        }

        .event-main-content {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 900px) {
            .event-main-content {
                grid-template-columns: 1fr;
            }
        }

        .event-details h2 {
            margin: 0 0 10px 0;
            color: var(--croatia-blue);
            font-size: 1.5rem;
        }

        .event-info-item {
            margin: 5px 0;
            font-size: 0.95rem;
            color: #333;
        }

        .event-info-item strong {
            color: var(--croatia-blue);
        }

        .event-speech-hr {
            background: #f8fafc;
            border-left: 4px solid var(--croatia-blue);
            padding: 10px 15px;
            border-radius: 0 8px 8px 0;
            font-style: italic;
            font-size: 0.9rem;
            margin-top: 10px;
            color: #1e293b;
            box-shadow: 0 2px 5px rgba(0,0,0,0.03);
        }

        .event-speech-es {
            background: #f1f5f9;
            border-left: 4px solid var(--croatia-red);
            padding: 10px 15px;
            border-radius: 0 8px 8px 0;
            font-style: italic;
            font-size: 0.9rem;
            margin-top: 8px;
            color: #475569;
            box-shadow: 0 2px 5px rgba(0,0,0,0.03);
            display: none;
        }

        .media-container {
            position: relative;
            width: 100%;
            height: 280px;
            background: #000;
            border-radius: 10px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            gap: 10px;
            padding: 10px;
            box-sizing: border-box;
        }

        .media-container img {
            position: absolute;
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            object-fit: contain;
            opacity: 0;
            transition: opacity 1s ease-in-out;
        }

        .media-container img.active {
            opacity: 1;
        }

        .media-container video {
            position: absolute;
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            object-fit: contain;
        }

        .pdf-download-link {
            background: rgba(255, 255, 255, 0.9);
            color: var(--croatia-blue);
            padding: 6px 14px;
            border-radius: 6px;
            font-weight: bold;
            text-decoration: none;
            font-size: 0.85rem;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            z-index: 10;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .pdf-download-link:hover {
            background: #ffffff;
        }

        .events-section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 8px;
            margin-bottom: 12px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .events-section-header h3 {
            color: var(--croatia-blue);
            margin: 0;
        }

        .events-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 15px;
        }

        .event-card {
            background: white;
            border: 2px solid #cbd5e1;
            border-radius: 10px;
            padding: 15px;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }

        .event-card:hover {
            border-color: var(--croatia-blue);
            transform: translateY(-3px);
            box-shadow: 0 6px 15px rgba(0,81,186,0.15);
        }

        .event-card h4 {
            margin: 0 0 8px 0;
            color: var(--croatia-blue);
            font-size: 1.1rem;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: white;
            padding: 25px;
            border-radius: 12px;
            width: 90%;
            max-width: 600px;
            max-height: 90vh;
            overflow-y: auto;
            border: 3px solid var(--croatia-blue);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .modal-content h3 {
            margin-top: 0;
            color: var(--croatia-blue);
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .form-group label {
            font-weight: bold;
            font-size: 0.9rem;
            color: #333;
        }

        .form-group input, .form-group textarea {
            padding: 8px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 0.95rem;
        }

        .modal-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 10px;
        }
    </style>
</head>
<body id="appBody">

    <!-- Perfil flotante -->
    <div class="user-floating-badge" id="userFloatingBadge" style="display: none;">
        <img id="userAvatarMini" src="imagenes/default-avatar.png" alt="Avatar" class="user-avatar-mini">
        <span id="userNameMini" class="user-name-mini">Usuario</span>
    </div>

    <div class="agenda-container">
        <div class="agenda-header">
            <span id="badgeIdioma" class="badge-idioma" onclick="alternarIdioma()" title="Promijeni jezik / Cambiar idioma">HR-ES</span>

            <h1 id="tituloAgenda">📅 Kalendar Događaja / Agenda de Eventos</h1>

            <div class="header-actions">
                <button class="btn-volver" onclick="window.location.href='index.html'">
                    ⬅ <span id="btnVolverText">Natrag - Volver al Inicio</span>
                </button>
            </div>
        </div>

        <div class="featured-event-box">
            <span class="featured-badge" id="badgeProximo">🌟 Najbliže događanje / Próximo Evento</span>
            <div class="event-main-content" style="display: grid; grid-template-columns: 1.2fr 1fr; gap: 20px; align-items: center;">
                <div class="event-details">
                    <h2 id="feat-titulo">Cargando evento...</h2>
                    <p class="event-info-item"><strong id="lblFecha">Datum i vrijeme / Fecha y Hora:</strong> <span id="feat-fecha">--</span></p>
                    <p class="event-info-item"><strong id="lblLugar">Mjesto / Lugar:</strong> <span id="feat-lugar">--</span></p>
                    <p class="event-info-item"><strong id="lblAsociacion">Udruga / Asociación:</strong> <span id="feat-asociacion">--</span></p>
                    
                    <div class="event-speech-hr" id="feat-speech-hr">--</div>
                    <div class="event-speech-es" id="feat-speech-es">--</div>
                </div>

                <!-- Columna derecha: Video a la izquierda e Imágenes a la derecha -->
                <div style="display: flex; gap: 10px; width: 100%; justify-content: flex-end; flex-wrap: wrap;">
                    <!-- Pantalla para el Video -->
                    <div class="media-container" id="feat-media-video" style="display: none; width: 48%; height: 200px;"></div>
                    
                    <!-- Pantalla para Fotos e Imágenes -->
                    <div class="media-container" id="feat-media-fotos" style="display: none; width: 48%; height: 200px;"></div>
                </div>
            </div>
        </div>

        <div class="events-list-section">
            <div class="events-section-header">
                <h3 id="tituloTodos">Sva događanja / Todos los Eventos</h3>
                <button id="btnNuevoEvento" class="btn-admin" onclick="abrirModalNuevo()">
                    ➕ <span id="textBtnNuevo">Novi događaj / Nuevo Evento</span>
                </button>
            </div>
            <div class="events-grid" id="listaEventosGrid"></div>
        </div>
    </div>

    <!-- Modal para Agregar/Modificar Evento -->
    <div class="modal-overlay" id="modalEvento">
        <div class="modal-content">
            <h3 id="modalTitulo">Registriraj novi događaj</h3>
            <input type="hidden" id="eventoId">
            
            <div class="form-group">
                <label id="lblModTitleHr">Naslov (Hrvatski) *:</label>
                <input type="text" id="inputTituloHr" placeholder="Ej. Proslava Dana državnosti">
            </div>
            <div class="form-group">
                <label id="lblModTitleEs">Naslov (Španjolski / Español):</label>
                <input type="text" id="inputTituloEs" placeholder="Ej. Celebración del Día Nacional">
            </div>
            <div class="form-group">
                <label id="lblModDate">Datum i vrijeme / Fecha y Hora *:</label>
                <input type="datetime-local" id="inputFechaHora">
            </div>
            <div class="form-group">
                <label id="lblModPlace">Mjesto / Lugar:</label>
                <input type="text" id="inputLugar" placeholder="Ej. Teatro Municipal">
            </div>
            <div class="form-group">
                <label id="lblModAssoc">Udruga / Asociación:</label>
                <input type="text" id="inputAsociacion" placeholder="Ej. Domovina">
            </div>
            <div class="form-group">
                <label id="lblModSpeechHr">Govor (Hrvatski):</label>
                <textarea id="inputSpeechHr" rows="2"></textarea>
            </div>
            <div class="form-group">
                <label id="lblModSpeechEs">Govor (Španjolski / Español):</label>
                <textarea id="inputSpeechEs" rows="2"></textarea>
            </div>
            <div class="form-group">
                <label id="lblModFiles">Slike, grafike ili PDF dokumenti (možete odabrati više):</label>
                <input type="file" id="inputArchivosMultimedia" accept="image/*,.pdf" multiple>
            </div>
            <div class="form-group">
                <label id="lblModVideo">Video zapis (opcionalno / opcional):</label>
                <input type="file" id="inputArchivoVideo" accept="video/*">
            </div>

            <div class="modal-buttons">
                <button type="button" onclick="cerrarModal()" id="btnModCancel" style="padding: 8px 15px; border-radius: 6px; border:1px solid #ccc; background:#fff; cursor:pointer;">Odustani / Cancelar</button>
                <button type="button" onclick="guardarEvento()" id="btnModSave" style="padding: 8px 15px; border-radius: 6px; background:var(--croatia-blue); color:white; border:none; font-weight:bold; cursor:pointer;">Spremi / Guardar</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="inactivity-logout.js"></script>

    <script>
        const SUPABASE_URL = 'https://pizswxittpzwwrymougc.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_s9U9C-8dCR3NfP3s6MEuhA_ADfGUXu8';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let eventosData = [];
        let intervaloSlideshow = null;
        let esProfesorAdmin = false;

        window.addEventListener("DOMContentLoaded", async () => {
            verificarIdiomaYAplicar();
            await cargarPerfilYValidarRol();
            await cargarEventosDesdeSupabase();
        });

        async function cargarPerfilYValidarRol() {
            try {
                const { data: { session } } = await supabaseClient.auth.getSession();
                if (session && session.user) {
                    const userId = session.user.id;
                    const { data: perfil } = await supabaseClient
                        .from('perfiles')
                        .select('nombre, apellido, foto_url, role')
                        .eq('id', userId)
                        .single();

                    if (perfil) {
                        const nombreCompleto = `${perfil.nombre || ''} ${perfil.apellido || ''}`.trim();
                        document.getElementById('userNameMini').innerText = nombreCompleto || "Usuario";
                        if (perfil.foto_url) {
                            document.getElementById('userAvatarMini').src = perfil.foto_url;
                        }
                        document.getElementById('userFloatingBadge').style.display = 'flex';

                        if (perfil.role === 'profesor' || perfil.role === 'administrador') {
                            esProfesorAdmin = true;
                            const btnAdmin = document.getElementById('btnNuevoEvento');
                            if (btnAdmin) btnAdmin.style.display = 'inline-flex';
                        }
                    }
                }
            } catch (err) {
                console.log("Visitante o error al cargar perfil:", err);
            }
        }

        async function cargarEventosDesdeSupabase() {
            try {
                const { data, error } = await supabaseClient
                    .from('eventos')
                    .select('*')
                    .order('fecha_hora', { ascending: true });

                if (error) throw error;

                if (data && data.length > 0) {
                    const idiomaActual = (localStorage.getItem('idiomaApp') || 'hr-es').trim().toLowerCase();
                    
                    eventosData = data.map(ev => {
                        const tHr = ev.titulo_hr || "";
                        const tEs = ev.titulo_es || "";
                        
                        let tituloFinal = tHr;
                        if (idiomaActual !== 'hr' && tEs) {
                            tituloFinal = `${tHr} - ${tEs}`;
                        }

                        return {
                            id: ev.id,
                            tituloOriginalHr: tHr,
                            tituloOriginalEs: tEs,
                            titulo: tituloFinal,
                            fechaISO: ev.fecha_hora,
                            fechaTexto: formatearFechaTexto(ev.fecha_hora),
                            lugar: ev.lugar || "",
                            asociacion: ev.asociacion || "",
                            speechHr: ev.speech_hr || "",
                            speechEs: ev.speech_es || "",
                            fotos: ev.fotos || [],
                            video: ev.video || ""
                        };
                    });

                    inicializarAgenda();
                } else {
                    document.getElementById("feat-titulo").innerText = "Nema zakazanih događanja / No hay eventos programados";
                }
            } catch (err) {
                console.error("Error al cargar la agenda:", err);
                document.getElementById("feat-titulo").innerText = "Error al conectar con la base de datos";
            }
        }

        function formatearFechaTexto(fechaIsoStr) {
            if (!fechaIsoStr) return "--";
            const fechaLimpia = fechaIsoStr.replace('Z', '');
            const fecha = new Date(fechaLimpia);
            
            return fecha.toLocaleString('es-ES', { 
                day: 'numeric', 
                month: 'long', 
                year: 'numeric', 
                hour: '2-digit', 
                minute: '2-digit',
                timeZone: 'UTC'
            }) + " hs";
        }

        function verificarIdiomaYAplicar() {
            let idiomaElegido = (localStorage.getItem('idiomaApp') || 'hr-es').trim().toLowerCase();
            const badge = document.getElementById('badgeIdioma');
            const btnVolverText = document.getElementById('btnVolverText');
            const textBtnNuevo = document.getElementById('textBtnNuevo');
            const tituloAgenda = document.getElementById('tituloAgenda');
            const badgeProximo = document.getElementById('badgeProximo');
            const lblFecha = document.getElementById('lblFecha');
            const lblLugar = document.getElementById('lblLugar');
            const lblAsociacion = document.getElementById('lblAsociacion');
            const tituloTodos = document.getElementById('tituloTodos');

            if (idiomaElegido === 'hr') {
                badge.innerText = "HR";
                tituloAgenda.innerText = "📅 Kalendar Događaja";
                btnVolverText.innerText = "Natrag";
                textBtnNuevo.innerText = "Novi događaj";
                badgeProximo.innerText = "🌟 Najbliže događanje";
                lblFecha.innerText = "Datum i vrijeme:";
                lblLugar.innerText = "Mjesto:";
                lblAsociacion.innerText = "Udruga:";
                tituloTodos.innerText = "Sva događanja";

                document.getElementById('lblModTitleHr').innerText = "Naslov (Hrvatski) *:";
                document.getElementById('lblModTitleEs').innerText = "Naslov (Španjolski):";
                document.getElementById('lblModDate').innerText = "Datum i vrijeme *:";
                document.getElementById('lblModPlace').innerText = "Mjesto:";
                document.getElementById('lblModAssoc').innerText = "Udruga:";
                document.getElementById('lblModSpeechHr').innerText = "Govor (Hrvatski):";
                document.getElementById('lblModSpeechEs').innerText = "Govor (Španjolski):";
                document.getElementById('lblModFiles').innerText = "Slike, grafike ili PDF dokumenti:";
                document.getElementById('lblModVideo').innerText = "Video zapis:";
                document.getElementById('btnModCancel').innerText = "Odustani";
                document.getElementById('btnModSave').innerText = "Spremi";
            } else {
                badge.innerText = "HR-ES";
                tituloAgenda.innerText = "📅 Kalendar Događaja / Agenda de Eventos";
                btnVolverText.innerText = "Natrag - Volver al Inicio";
                textBtnNuevo.innerText = "Novi događaj / Nuevo Evento";
                badgeProximo.innerText = "🌟 Najbliže događanje / Próximo Evento";
                lblFecha.innerText = "Datum i vrijeme / Fecha y Hora:";
                lblLugar.innerText = "Mjesto / Lugar:";
                lblAsociacion.innerText = "Udruga / Asociación:";
                tituloTodos.innerText = "Sva događanja / Todos los Eventos";

                document.getElementById('lblModTitleHr').innerText = "Naslov (Hrvatski) / Título (Croata) *:";
                document.getElementById('lblModTitleEs').innerText = "Naslov (Španjolski) / Título (Español):";
                document.getElementById('lblModDate').innerText = "Datum i vrijeme / Fecha y Hora *:";
                document.getElementById('lblModPlace').innerText = "Mjesto / Lugar:";
                document.getElementById('lblModAssoc').innerText = "Udruga / Asociación:";
                document.getElementById('lblModSpeechHr').innerText = "Govor (Hrvatski) / Speech (Croata):";
                document.getElementById('lblModSpeechEs').innerText = "Govor (Španjolski) / Speech (Español):";
                document.getElementById('lblModFiles').innerText = "Slike, grafike ili PDF / Fotos, gráficos o PDF:";
                document.getElementById('lblModVideo').innerText = "Video zapis / Video:";
                document.getElementById('btnModCancel').innerText = "Odustani / Cancelar";
                document.getElementById('btnModSave').innerText = "Spremi / Guardar";
            }
        }

        function alternarIdioma() {
            let idiomaActual = (localStorage.getItem('idiomaApp') || 'hr-es').trim().toLowerCase();
            if (idiomaActual.includes("es")) {
                localStorage.setItem('idiomaApp', 'hr');
            } else {
                localStorage.setItem('idiomaApp', 'hr-es');
            }
            location.reload();
        }

        function inicializarAgenda() {
            const ahora = new Date();
            const proximoEvento = eventosData.find(e => new Date(e.fechaISO) >= ahora) || eventosData[0];
            mostrarDetalleEvento(proximoEvento);

            const grid = document.getElementById("listaEventosGrid");
            grid.innerHTML = "";

            eventosData.forEach(ev => {
                const card = document.createElement("div");
                card.className = "event-card";
                
                let htmlCard = `
                    <h4>${ev.titulo}</h4>
                    <p style="margin:4px 0; font-size:0.85rem; color:#555;">📅 ${ev.fechaTexto}</p>
                    <p style="margin:4px 0; font-size:0.85rem; color:#0051ba;">🏛️ ${ev.asociacion || 'N/D'}</p>
                `;

                if (esProfesorAdmin) {
                    htmlCard += `
                        <div class="admin-controls-card" style="display: block; margin-top: 8px;">
                            <button class="btn-editar-card" onclick="event.stopPropagation(); abrirModalEditar(${ev.id})">Modificar</button>
                            <button class="btn-eliminar-card" onclick="event.stopPropagation(); eliminarEvento(${ev.id})">Eliminar</button>
                        </div>
                    `;
                }

                card.innerHTML = htmlCard;
                card.onmouseenter = () => mostrarDetalleEvento(ev);
                card.onclick = () => mostrarDetalleEvento(ev);
                grid.appendChild(card);
            });
        }

        function mostrarDetalleEvento(ev) {
            let idiomaElegido = (localStorage.getItem('idiomaApp') || 'hr-es').trim().toLowerCase();

            document.getElementById("feat-titulo").innerText = ev.titulo;
            document.getElementById("feat-fecha").innerText = ev.fechaTexto;
            document.getElementById("feat-lugar").innerText = ev.lugar || "--";
            document.getElementById("feat-asociacion").innerText = ev.asociacion || "--";
            
            const speechHrEl = document.getElementById("feat-speech-hr");
            speechHrEl.innerText = ev.speechHr ? `"${ev.speechHr}"` : "--";

            const speechEsEl = document.getElementById("feat-speech-es");
            if (idiomaElegido !== 'hr' && ev.speechEs) {
                speechEsEl.innerText = `"${ev.speechEs}"`;
                speechEsEl.style.display = 'block';
            } else {
                speechEsEl.style.display = 'none';
            }

            if (intervaloSlideshow) {
                clearInterval(intervaloSlideshow);
            }

            // --- GESTIÓN DE LA PANTALLA DE VIDEO ---
            const contenedorVideo = document.getElementById("feat-media-video");
            contenedorVideo.innerHTML = "";
            if (ev.video && ev.video.trim() !== "") {
                contenedorVideo.style.display = "flex";
                const videoEl = document.createElement("video");
                videoEl.src = ev.video.trim();
                videoEl.controls = false; // Lo dejamos sin controles para que actúe como un elemento animado limpio
                videoEl.autoplay = true;  // <--- Esto hace que se mueva solo automáticamente
                videoEl.muted = true;     // <--- Obligatorio para que los navegadores permitan el autoplay
                videoEl.loop = true;      // <--- Se repite infinitamente
                videoEl.playsInline = true;
                contenedorVideo.appendChild(videoEl);
            } else {
                contenedorVideo.style.display = "none";
            }

            // --- GESTIÓN DE LA PANTALLA DE FOTOS Y PDFS ---
            const contenedorFotos = document.getElementById("feat-media-fotos");
            contenedorFotos.innerHTML = "";
            
            if (ev.fotos && ev.fotos.length > 0) {
                contenedorFotos.style.display = "flex";
                const imagenes = ev.fotos.filter(f => !f.toLowerCase().endsWith('.pdf'));
                const pdfs = ev.fotos.filter(f => f.toLowerCase().endsWith('.pdf'));

                // Renderizar imágenes en carrusel
                imagenes.forEach((foto, index) => {
                    const img = document.createElement("img");
                    img.src = foto;
                    if (index === 0) img.classList.add("active");
                    contenedorFotos.appendChild(img);
                });

                if (imagenes.length > 1) {
                    let currentIndex = 0;
                    intervaloSlideshow = setInterval(() => {
                        const imgs = contenedorFotos.querySelectorAll("img");
                        if(imgs.length === 0) return;
                        imgs[currentIndex].classList.remove("active");
                        currentIndex = (currentIndex + 1) % imgs.length;
                        imgs[currentIndex].classList.add("active");
                    }, 3500);
                }

                // Renderizar enlaces de PDF
                pdfs.forEach((pdfUrl, idx) => {
                    const a = document.createElement("a");
                    a.href = pdfUrl;
                    a.target = "_blank";
                    a.className = "pdf-download-link";
                    a.innerHTML = `📄 ${idiomaElegido === 'hr' ? 'Preuzmi PDF dokument ' + (idx + 1) : 'Ver / Descargar PDF ' + (idx + 1)}`;
                    contenedorFotos.appendChild(a);
                });

                if (imagenes.length === 0 && pdfs.length === 0) {
                    contenedorFotos.style.display = "none";
                }
            } else {
                contenedorFotos.style.display = "none";
            }
        }

        function abrirModalNuevo() {
            let idiomaElegido = (localStorage.getItem('idiomaApp') || 'hr-es').trim().toLowerCase();
            document.getElementById("modalTitulo").innerText = (idiomaElegido === 'hr') ? "Registriraj novi događaj" : "Registrar Nuevo Evento / Registriraj novi događaj";
            document.getElementById("eventoId").value = "";
            document.getElementById("inputTituloHr").value = "";
            document.getElementById("inputTituloEs").value = "";
            document.getElementById("inputFechaHora").value = "";
            document.getElementById("inputLugar").value = "";
            document.getElementById("inputAsociacion").value = "";
            document.getElementById("inputSpeechHr").value = "";
            document.getElementById("inputSpeechEs").value = "";
            document.getElementById("inputArchivosMultimedia").value = "";
            document.getElementById("inputArchivoVideo").value = "";
            document.getElementById("modalEvento").style.display = "flex";
        }

        function abrirModalEditar(id) {
            const ev = eventosData.find(e => e.id === id);
            if (!ev) return;

            let idiomaElegido = (localStorage.getItem('idiomaApp') || 'hr-es').trim().toLowerCase();
            document.getElementById("modalTitulo").innerText = (idiomaElegido === 'hr') ? "Izmijeni događaj" : "Modificar Evento / Izmijeni događaj";
            document.getElementById("eventoId").value = ev.id;
            document.getElementById("inputTituloHr").value = ev.tituloOriginalHr || "";
            document.getElementById("inputTituloEs").value = ev.tituloOriginalEs || "";
            document.getElementById("inputFechaHora").value = ev.fechaISO ? ev.fechaISO.replace('Z', '').slice(0, 16) : "";
            document.getElementById("inputLugar").value = ev.lugar || "";
            document.getElementById("inputAsociacion").value = ev.asociacion || "";
            document.getElementById("inputSpeechHr").value = ev.speechHr || "";
            document.getElementById("inputSpeechEs").value = ev.speechEs || "";
            document.getElementById("inputArchivosMultimedia").value = "";
            document.getElementById("inputArchivoVideo").value = "";
            document.getElementById("modalEvento").style.display = "flex";
        }

        function cerrarModal() {
            document.getElementById("modalEvento").style.display = "none";
        }

        // --- LÓGICA DE ALTA, MODIFICACIÓN Y SUBIDA DE ARCHIVOS (IMÁGENES Y PDF) ---
        async function guardarEvento() {
            let idiomaElegido = (localStorage.getItem('idiomaApp') || 'hr-es').trim().toLowerCase();
            const id = document.getElementById("eventoId").value;
            const titulo_hr = document.getElementById("inputTituloHr").value.trim();
            const titulo_es = document.getElementById("inputTituloEs").value.trim();
            const fechaHoraInput = document.getElementById("inputFechaHora").value;
            const lugar = document.getElementById("inputLugar").value.trim();
            const asociacion = document.getElementById("inputAsociacion").value.trim();
            const speech_hr = document.getElementById("inputSpeechHr").value.trim();
            const speech_es = document.getElementById("inputSpeechEs").value.trim();
            
            const inputArchivos = document.getElementById("inputArchivosMultimedia").files;
            const inputVideoFile = document.getElementById("inputArchivoVideo").files[0];

            if (!titulo_hr || !fechaHoraInput) {
                alert(idiomaElegido === 'hr' ? "Molimo unesite hrvatski naslov i valjani datum." : "Por favor completa el Título en croata y selecciona una Fecha y Hora válidas.");
                return;
            }

            const btnGuardar = document.getElementById('btnModSave');
            const textoOriginalBoton = btnGuardar.innerText;
            btnGuardar.disabled = true;
            btnGuardar.innerText = idiomaElegido === 'hr' ? "Učitavanje datoteka..." : "Subiendo archivos y guardando...";

            const fechaLocalExacta = new Date(fechaHoraInput).toISOString();

            try {
                let eventoIdActual = id;
                const objetoEventoBase = {
                    titulo_hr,
                    titulo_es: titulo_es || null,
                    fecha_hora: fechaLocalExacta,
                    lugar: lugar || null,
                    asociacion: asociacion || null,
                    speech_hr: speech_hr || null,
                    speech_es: speech_es || null
                };

                // PASO 1: Guardar o actualizar datos básicos para asegurar el ID exacto
                if (eventoIdActual) {
                    const { error: errUpd } = await supabaseClient
                        .from('eventos')
                        .update(objetoEventoBase)
                        .eq('id', eventoIdActual);
                    if (errUpd) throw errUpd;
                } else {
                    const { data: nuevoReg, error: errIns } = await supabaseClient
                        .from('eventos')
                        .insert([objetoEventoBase])
                        .select()
                        .single();
                    if (errIns) throw errIns;
                    eventoIdActual = nuevoReg.id;
                }

                let updatesMultimedia = {};

                // PASO 2: Subir y renombrar fotos y PDFs uno por uno
                if (inputArchivos.length > 0) {
                    let rutasArchivos = [];
                    for (let i = 0; i < inputArchivos.length; i++) {
                        const archivo = inputArchivos[i];
                        const extension = archivo.name.split('.').pop().toLowerCase();
                        const tipoNombre = extension === 'pdf' ? 'pdf' : 'foto';
                        const nombrePersonalizado = `evento_${eventoIdActual}_${tipoNombre}_${Date.now()}_${i + 1}.${extension}`;
                        
                        const urlSubida = await subirArchivoLocalASupabase(archivo, nombrePersonalizado);
                        if (urlSubida) rutasArchivos.push(urlSubida);
                    }
                    updatesMultimedia.fotos = rutasArchivos;
                }

                // PASO 3: Subir video si existe
                if (inputVideoFile) {
                    const extensionVid = inputVideoFile.name.split('.').pop();
                    const nombreVideoPersonalizado = `evento_${eventoIdActual}_video_${Date.now()}.${extensionVid}`;
                    
                    const urlVideoSubido = await subirArchivoLocalASupabase(inputVideoFile, nombreVideoPersonalizado);
                    if (urlVideoSubido) updatesMultimedia.video = urlVideoSubido;
                }

                // PASO 4: Actualizar las rutas multimedia en Supabase
                if (Object.keys(updatesMultimedia).length > 0) {
                    const { error: errMedia } = await supabaseClient
                        .from('eventos')
                        .update(updatesMultimedia)
                        .eq('id', eventoIdActual);
                    if (errMedia) throw errMedia;
                }

                alert(idiomaElegido === 'hr' ? "Uspješno spremljeno!" : (id ? "¡Evento modificado con éxito!" : "¡Nuevo evento creado con éxito!"));
                cerrarModal();
                await cargarEventosDesdeSupabase();
            } catch (err) {
                console.error("Error al guardar el evento:", err);
                alert(idiomaElegido === 'hr' ? "Došlo je do pogreške pri prijenosu." : "Hubo un error al guardar el evento o los archivos. Revisa el tamaño de los archivos.");
            } finally {
                btnGuardar.disabled = false;
                btnGuardar.innerText = textoOriginalBoton;
            }
        }

        async function subirArchivoLocalASupabase(archivo, nombrePersonalizado) {
            const { error } = await supabaseClient.storage
                .from('Alumnos_fotos')
                .upload(nombrePersonalizado, archivo, { upsert: true });

            if (error) {
                console.error("Error al subir archivo al Storage:", error);
                return null;
            }

            const { data: urlData } = supabaseClient.storage
                .from('Alumnos_fotos')
                .getPublicUrl(nombrePersonalizado);

            return urlData.publicUrl;
        }

        // --- LÓGICA DE BAJA Y LIMPIEZA DE ARCHIVOS ---
        async function eliminarEvento(id) {
            let idiomaElegido = (localStorage.getItem('idiomaApp') || 'hr-es').trim().toLowerCase();
            let mensajeConfirm = idiomaElegido === 'hr' ? "Jeste li sigurni da želite izbrisati ovaj događaj?" : "¿Estás seguro de que deseas eliminar este evento? Se borrarán también los archivos asociados.";
            
            if (!confirm(mensajeConfirm)) return;

            try {
                const eventoAEliminar = eventosData.find(e => e.id === id);

                if (eventoAEliminar) {
                    let archivosABorrar = [];

                    if (eventoAEliminar.fotos && eventoAEliminar.fotos.length > 0) {
                        eventoAEliminar.fotos.forEach(urlFoto => {
                            const partes = urlFoto.split('/');
                            const nombreArchivo = partes[partes.length - 1];
                            if (nombreArchivo) archivosABorrar.push(nombreArchivo);
                        });
                    }

                    if (eventoAEliminar.video) {
                        const partesVideo = eventoAEliminar.video.split('/');
                        const nombreVideo = partesVideo[partesVideo.length - 1];
                        if (nombreVideo) archivosABorrar.push(nombreVideo);
                    }

                    if (archivosABorrar.length > 0) {
                        await supabaseClient.storage
                            .from('Alumnos_fotos')
                            .remove(archivosABorrar);
                    }
                }

                const { error } = await supabaseClient
                    .from('eventos')
                    .delete()
                    .eq('id', id);

                if (error) throw error;

                alert(idiomaElegido === 'hr' ? "Događaj je izbrisan." : "¡Evento y sus archivos eliminados correctamente!");
                await cargarEventosDesdeSupabase();
            } catch (err) {
                console.error("Error al eliminar el evento:", err);
                alert(idiomaElegido === 'hr' ? "Greška pri brisanju." : "Hubo un error al intentar eliminar el evento.");
            }
        }
    </script>
