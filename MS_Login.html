<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prijava — Mala Škola</title>
    <style>
        :root {
            --croatia-blue: #0051ba;
            --croatia-red: #d90f13;
            --bg-color: #1b264f;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(rgba(0,0,0,0.4), rgba(0,0,0,0.4)), 
                        url('imagenes/Bandera-Croacia.avif') no-repeat center center fixed;
            background-size: cover;
            background-color: var(--bg-color);
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .login-card {
            background: rgba(255, 255, 255, 0.98);
            padding: 25px 30px;
            border-radius: 14px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 3px solid var(--croatia-blue);
            width: 100%;
            max-width: 380px;
            box-sizing: border-box;
            text-align: center;
        }
        h2 { color: var(--croatia-red); margin-top: 0; font-size: 1.3rem; }
        .sub { color: var(--croatia-blue); font-weight: bold; font-size: 0.8rem; margin-bottom: 20px; }
        .input-group { text-align: left; margin-bottom: 12px; }
        label { display: block; font-weight: bold; font-size: 0.78rem; color: #475569; margin-bottom: 3px; }
        input {
            width: 100%;
            padding: 8px 10px;
            border: 2px solid #cbd5e1;
            border-radius: 6px;
            font-size: 0.9rem;
            box-sizing: border-box;
            outline: none;
        }
        input:focus { border-color: var(--croatia-blue); }

        /* Contenedor relativo para posicionar el botón de mostrar/ocultar contraseña */
        .password-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }
        .password-wrapper input {
            padding-right: 38px; /* Espacio para que el texto no choque con el botón */
        }
        .btn-toggle-password {
            position: absolute;
            right: 6px;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.1rem;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #64748b;
        }
        .btn-toggle-password:hover {
            color: var(--croatia-blue);
        }

        .btn-login {
            width: 100%;
            padding: 10px;
            font-weight: bold;
            color: white;
            background: var(--croatia-blue);
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9rem;
            margin-top: 10px;
            transition: background 0.2s;
        }
        .btn-login:hover { background: #003380; }

        /* Estilo para el botón de cancelar / volver */
        .btn-cancelar {
            display: block;
            width: 100%;
            padding: 9px;
            font-weight: bold;
            color: #475569;
            background: #f1f5f9;
            border: 2px solid #cbd5e1;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            margin-top: 8px;
            text-decoration: none;
            box-sizing: border-box;
            transition: all 0.2s;
        }
        .btn-cancelar:hover {
            background: #e2e8f0;
            color: #1e293b;
        }

        .msg { font-size: 0.82rem; margin-top: 10px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="login-card">
        <h2>Prijava — Mala Škola</h2>
        <p class="sub">Acceso Seguro de Administrador</p>
        
        <div class="input-group">
            <label>Elektronička pošta (Correo)</label>
            <input type="email" id="emailLogin" placeholder="tu-correo@hotmail.com">
        </div>

        <div class="input-group">
            <label>Lozinka (Contraseña)</label>
            <div class="password-wrapper">
                <input type="password" id="passwordLogin" placeholder="Tu contraseña de Supabase">
                <button type="button" class="btn-toggle-password" id="btnTogglePass" onclick="alternarVisibilidadPassword()" title="Mostrar/Ocultar contraseña">👁️</button>
            </div>
        </div>

        <button class="btn-login" onclick="iniciarSesion()">Uđi / Iniciar Sesión 🔑</button>
        
        <!-- Botón para cancelar y volver a la página de inicio (index.html) -->
        <a href="index.html" class="btn-cancelar">Odustani / Cancelar ↩</a>

        <div id="msgLogin" class="msg"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SUPABASE_URL = 'https://pizswxittpzwwrymougc.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_s9U9C-8dCR3NfP3s6MEuhA_ADfGUXu8';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        function alternarVisibilidadPassword() {
            const inputPass = document.getElementById('passwordLogin');
            const btnToggle = document.getElementById('btnTogglePass');

            if (inputPass.type === 'password') {
                inputPass.type = 'text';
                btnToggle.innerText = '🙈'; // Ojo tachado o monito con los ojos tapados para indicar que se ve en texto plano
                btnToggle.title = "Ocultar contraseña";
            } else {
                inputPass.type = 'password';
                btnToggle.innerText = '👁️'; // Ojo normal para indicar que está oculta
                btnToggle.title = "Mostrar contraseña";
            }
        }

        async function iniciarSesion() {
            const email = document.getElementById('emailLogin').value.trim();
            const password = document.getElementById('passwordLogin').value.trim();
            const msg = document.getElementById('msgLogin');

            msg.style.color = "#1e293b";
            msg.innerText = "Iniciando sesión...";

            const { data, error } = await supabaseClient.auth.signInWithPassword({
                email: email,
                password: password,
            });

            if (error) {
                msg.style.color = "#ef4444";
                msg.innerText = "Error: Credenciales incorrectas.";
                return;
            }

            msg.style.color = "#16a34a";
            msg.innerText = "¡Acceso concedido! Redirigiendo...";
            
            // Redirige correctamente al Menú Principal (MS_Index1.html)
            setTimeout(() => {
                window.location.href = "MS_Index1.html";
            }, 1000);
        }
    </script>
</body>
</html>
