<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prueba de Teclado Croata</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #1b264f;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background: #ffffff;
            color: #222;
            padding: 30px 40px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 450px;
            border: 4px solid #0051ba;
        }

        h2 {
            margin: 0;
            color: #0051ba;
            text-align: center;
            font-size: 1.4rem;
        }

        p {
            margin: 0;
            font-size: 0.9rem;
            color: #555;
            text-align: center;
        }

        .botones-acentos {
            display: flex;
            justify-content: center;
            gap: 15px;
            background: #f1f5f9;
            padding: 10px;
            border-radius: 8px;
            border: 2px solid #cbd5e1;
        }

        .btn-acento-croata {
            width: 45px;
            height: 45px;
            cursor: pointer;
            border: 2px solid transparent;
            border-radius: 6px;
            padding: 4px;
            background: #fff;
            object-fit: contain;
            transition: all 0.2s ease;
        }

        .btn-acento-croata:hover {
            transform: scale(1.05);
        }

        .btn-acento-croata.activo {
            border-color: #0051ba;
            background-color: #e0f2fe;
            box-shadow: 0 0 10px rgba(0, 81, 186, 0.6);
            transform: scale(1.12);
        }

        label {
            font-size: 0.85rem;
            font-weight: bold;
            color: #334155;
            margin-bottom: -10px;
        }

        input[type="text"] {
            padding: 10px;
            font-size: 1.1rem;
            border: 2px solid #cbd5e1;
            border-radius: 8px;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: #0051ba;
            box-shadow: 0 0 5px rgba(0, 81, 186, 0.3);
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>Prueba de Acentos y Posición</h2>
        <p>Prueba escribir en distintas líneas, ubicar el cursor en el medio de una palabra y hacer clic en los acentos.</p>

        <!-- Los 3 iconos de acentos (pasamos event con mousedown para retener el foco) -->
        <div class="botones-acentos">
            <img src="imagenes/Caron.bmp" class="btn-acento-croata" onmousedown="activarAcentoCroata('caron', this, event)" alt="Caron">
            <img src="imagenes/Acento.bmp" class="btn-acento-croata" onmousedown="activarAcentoCroata('acento', this, event)" alt="Acento">
            <img src="imagenes/Guion.bmp" class="btn-acento-croata" onmousedown="activarAcentoCroata('guion', this, event)" alt="Guion">
        </div>

        <!-- Múltiples líneas de escritura para comprobar renglón y posición exacta -->
        <label>Línea 1 (Verbos / Nacionalidad):</label>
        <input type="text" placeholder="Escribe aquí en la línea 1...">

        <label>Línea 2 (Familia):</label>
        <input type="text" placeholder="Escribe aquí en la línea 2...">

        <label>Línea 3 (Declinaciones):</label>
        <input type="text" placeholder="Escribe aquí en la línea 3...">
    </div>

    <script src="tecladoCroata.js"></script>
</body>
</html>
