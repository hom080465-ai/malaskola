<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mala Škola - Početak</title>
    <style>
        :root {
            --croatia-blue: #0051ba;
            --croatia-red: #d90f13;
            --white: #ffffff;
            --bg-color: #1b264f;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(rgba(0,0,0,0.35), rgba(0,0,0,0.35)), 
                        url('imagenes/Bandera-Croacia.avif') no-repeat center center fixed;
            background-size: cover;
            background-color: var(--bg-color);
            color: #222;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
            position: relative;
        }

        .container {
            width: 100%;
            max-width: 680px;
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(12px);
            border: 3px solid var(--croatia-blue);
            border-radius: 20px;
            padding: 40px 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            text-align: center;
            position: relative;
            z-index: 10;
        }

        /* Botón rojo interactivo de cambio de idioma arriba a la izquierda */
        .badge-idioma {
            position: absolute;
            top: 20px;
            left: 20px;
            background: var(--croatia-red);
            color: white;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 800;
            letter-spacing: 0.5px;
            border: 1px solid rgba(255,255,255,0.6);
            cursor: pointer;
            transition: transform 0.1s, background 0.2s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            z-index: 20;
        }

        .badge-idioma:hover {
            background: #b50b0f;
            transform: scale(1.05);
        }

        /* Botón pequeño de Login ubicado arriba a la derecha */
        .btn-login-esquina {
            position: absolute;
            top: 20px;
            right: 20px;
            background: var(--croatia-blue);
            color: white;
            padding: 5px 12px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 700;
            text-decoration: none;
            border: 1px solid rgba(255,255,255,0.6);
            cursor: pointer;
            transition: transform 0.1s, background 0.2s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            z-index: 20;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .btn-login-esquina:hover {
            background: #003380;
            transform: scale(1.05);
        }

        h1 {
            color: var(--croatia-red);
            margin: 0 0 10px 0;
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        .sub-espanol {
            color: var(--croatia-blue);
            font-size: 1.3rem;
            font-weight: 700;
            margin: 0 0 25px 0;
        }

        /* Cuadrícula de botones central */
        .menu-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 20px;
        }

        @media (max-width: 600px) {
            .menu-grid {
                grid-template-columns: 1fr;
            }
        }

        /* Botón general del menú */
        .btn-menu-item {
            background: #ffffff;
            color: var(--croatia-blue);
            border: 2px solid var(--croatia-blue);
            padding: 14px 18px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 0 3px 8px rgba(0,0,0,0.06);
            transition: all 0.2s;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-menu-item:hover {
            background: #f1f5f9;
            border-color: var(--croatia-red);
            color: var(--croatia-red);
            transform: translateY(-2px);
        }

        /* Ocupa todo el ancho superior de la grilla */
        .full-width {
            grid-column: 1 / -1;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Botón rojo interactivo de cambio de idioma (arriba a la izquierda) -->
        <span id="badgeIdioma" class="badge-idioma" onclick="alternarIdioma()" title="Hacer clic para cambiar idioma">HR</span>

        <!-- Botón pequeño de Login / Conectarse (arriba a la derecha) -->
        <a href="#" class="btn-login-esquina" id="btnLogin" onclick="iniciarSesionYVolver()">
            🔑 <span id="textLogin">Prijava / Login</span>
        </a>

        <!-- Títulos solicitados -->
        <h1 id="tituloCroata">Dobrodošli u Malu školu</h1>
        <p class="sub-espanol" id="subEspanol">Bienvenidos a Malu školu</p>

        <!-- Bloque de botones central -->
        <div class="menu-grid">
            <!-- Botón de Clases de Idioma -->
            <button class="btn-menu-item full-width" onclick="alert('Sección de Clases en construcción')" id="btnClases">
                📚 <span id="textClases">Započni (Tečaj jezika) / Clases de Idioma</span>
            </button>

            <!-- Botón de Agenda (Apunta correctamente a MS_Agenda.html) -->
            <button class="btn-menu-item" onclick="window.location.href='MS_Agenda.html'" id="btnAgenda">
                📅 <span id="textAgenda">Agenda / Agenda</span>
            </button>

            <!-- Botón de Actividades -->
            <button class="btn-menu-item" onclick="alert('Sección de Actividades en construcción')" id="btnActividades">
                🎯 <span id="textActividades">Aktivnosti / Actividades</span>
            </button>
            
            <!-- Botón de Historia -->
            <button class="btn-menu-item full-width" onclick="alert('Sección de Historia en construcción')" id="btnHistoria">
                🏛️ <span id="textHistoria">Povijest / Historia</span>
            </button>
        </div>
    </div>

    <!-- Script de configuración general -->
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            let idiomaElegido = localStorage.getItem('idiomaApp');
            if (!idiomaElegido) {
                idiomaElegido = 'hr-es';
                localStorage.setItem('idiomaApp', 'hr-es');
            }
            idiomaElegido = idiomaElegido.trim().toLowerCase();

            const subEspanol = document.getElementById('subEspanol');
            const textClases = document.getElementById('textClases');
            const textLogin = document.getElementById('textLogin');
            const badge = document.getElementById('badgeIdioma');
            const textActividades = document.getElementById('textActividades');
            const textAgenda = document.getElementById('textAgenda');
            const textHistoria = document.getElementById('textHistoria');

            if (idiomaElegido === 'hr') {
                badge.innerText = "HR";
                subEspanol.style.display = 'none';
                textClases.innerText = "Započni (Tečaj jezika)";
                textLogin.innerText = "Prijava";
                textActividades.innerText = "Aktivnosti";
                textAgenda.innerText = "Agenda";
                textHistoria.innerText = "Povijest";
            } else {
                badge.innerText = "HR-ES";
                subEspanol.style.display = 'block';
                subEspanol.innerText = "Bienvenidos a Malu školu";
                textClases.innerText = "Započni (Tečaj jezika) / Clases de Idioma";
                textLogin.innerText = "Prijava / Login";
                textActividades.innerText = "Aktivnosti / Actividades";
                textAgenda.innerText = "Agenda / Agenda";
                textHistoria.innerText = "Povijest / Historia";
            }
        });

        function alternarIdioma() {
            let idiomaActual = (localStorage.getItem('idiomaApp') || 'hr').trim().toLowerCase();
            
            if (idiomaActual === "hr-es" || idiomaActual.includes("es")) {
                localStorage.setItem('idiomaApp', 'hr');
            } else {
                localStorage.setItem('idiomaApp', 'hr-es');
            }
            
            location.reload();
        }
    </script>
</body>
</html>
