<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mala Škola - Početak</title>
    <style>
        :root {
            --croatia-blue: #0051ba;
            --croatia-red: #d90f13;
            --white: #ffffff;
            --bg-color: #1b264f;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(rgba(0,0,0,0.35), rgba(0,0,0,0.35)), 
                        url('imagenes/Bandera-Croacia.avif') no-repeat center center fixed;
            background-size: cover;
            background-color: var(--bg-color);
            color: #222;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            box-sizing: border-box;
            position: relative;
        }

        .container {
            width: 100%;
            max-width: 680px;
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(12px);
            border: 3px solid var(--croatia-blue);
            border-radius: 20px;
            padding: 40px 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            text-align: center;
            position: relative;
            z-index: 10;
        }

        /* Botón rojo interactivo de cambio de idioma arriba a la izquierda */
        .badge-idioma {
            position: absolute;
            top: 20px;
            left: 20px;
            background: var(--croatia-red);
            color: white;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 800;
            letter-spacing: 0.5px;
            border: 1px solid rgba(255,255,255,0.6);
            cursor: pointer;
            transition: transform 0.1s, background 0.2s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            z-index: 20;
        }

        .badge-idioma:hover {
            background: #b50b0f;
            transform: scale(1.05);
        }

        /* Botón inteligente de Login / Logout ubicado arriba a la derecha */
        .btn-login-esquina {
            position: absolute;
            top: 20px;
            right: 20px;
            background: var(--croatia-blue);
            color: white;
            padding: 5px 12px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 700;
            text-decoration: none;
            border: 1px solid rgba(255,255,255,0.6);
            cursor: pointer;
            transition: transform 0.1s, background 0.2s;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            z-index: 20;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .btn-login-esquina:hover {
            background: #003380;
            transform: scale(1.05);
        }

        h1 {
            color: var(--croatia-red);
            margin: 0 0 10px 0;
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: 0.5px;
        }

        .sub-espanol {
            color: var(--croatia-blue);
            font-size: 1.3rem;
            font-weight: 700;
            margin: 0 0 25px 0;
        }

        /* Cuadrícula de botones central */
        .menu-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 20px;
        }

        @media (max-width: 600px) {
            .menu-grid {
                grid-template-columns: 1fr;
            }
        }

        /* Botón general del menú */
        .btn-menu-item {
            background: #ffffff;
            color: var(--croatia-blue);
            border: 2px solid var(--croatia-blue);
            padding: 14px 18px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 0 3px 8px rgba(0,0,0,0.06);
            transition: all 0.2s;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-menu-item:hover {
            background: #f1f5f9;
            border-color: var(--croatia-red);
            color: var(--croatia-red);
            transform: translateY(-2px);
        }

        .full-width {
            grid-column: 1 / -1;
        }

        /* --- ESTILOS DE LOS MODALES ESTILO CROATA --- */
        .evento-modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            animation: fadeIn 0.3s ease-in-out;
        }

        .evento-popup-card {
            background: #ffffff;
            width: 90%;
            max-width: 450px;
            border-radius: 16px;
            border: 3px solid var(--croatia-blue);
            padding: 25px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            text-align: left;
            position: relative;
            box-sizing: border-box;
        }

        .btn-cerrar-popup {
            position: absolute;
            top: 12px;
            right: 12px;
            background: #ef4444;
            color: white;
            border: none;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background 0.2s;
        }

        .btn-cerrar-popup:hover {
            background: #dc2626;
        }

        .popup-badge {
            background: var(--croatia-red);
            color: white;
            padding: 3px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 10px;
        }

        .popup-titulo {
            color: var(--croatia-blue);
            font-size: 1.25rem;
            margin: 0 0 10px 0;
            font-weight: 800;
        }

        .popup-info {
            font-size: 0.9rem;
            color: #475569;
            margin: 5px 0;
        }

        .popup-btn-agenda {
            display: block;
            width: 100%;
            background: var(--croatia-blue);
            color: white;
            text-align: center;
            padding: 10px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            margin-top: 15px;
            box-sizing: border-box;
            transition: background 0.2s;
        }

        .popup-btn-agenda:hover {
            background: #003380;
        }

        .croatian-modal-card {
            background: #ffffff;
            width: 90%;
            max-width: 400px;
            border-radius: 16px;
            border: 3px solid var(--croatia-blue);
            padding: 25px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            text-align: center;
            box-sizing: border-box;
        }

        .croatian-modal-title {
            color: var(--croatia-blue);
            font-size: 1.3rem;
            font-weight: 800;
            margin-top: 0;
            margin-bottom: 10px;
        }

        .croatian-modal-text {
            color: #475569;
            font-size: 0.95rem;
            margin-bottom: 20px;
        }

        .croatian-modal-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .croatian-btn-primary {
            background: var(--croatia-red);
            color: white;
            border: none;
            padding: 8px 18px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .croatian-btn-primary:hover {
            background: #b50b0f;
        }

        .croatian-btn-secondary {
            background: #64748b;
            color: white;
            border: none;
            padding: 8px 18px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .croatian-btn-secondary:hover {
            background: #475569;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body>

    <!-- MODAL / BANNER DEL PRÓXIMO EVENTO -->
    <div class="evento-modal-overlay" id="modalProximoEvento" style="display: none;">
        <div class="evento-popup-card">
            <button class="btn-cerrar-popup" onclick="cerrarPopupEvento()" title="Cerrar">✕</button>
            <span class="popup-badge" id="popupBadgeText">🌟 Próximo Evento / Najbliže događanje</span>
            <h3 class="popup-titulo" id="popupTitulo">Cargando...</h3>
            <p class="popup-info">📅 <strong id="popupFecha">--</strong></p>
            <p class="popup-info">🏛️ <strong id="popupLugar">--</strong></p>
            <a href="MS_Agenda.html" class="popup-btn-agenda" id="popupBtnVerMas">Ver en la Agenda / Vidi u agendi</a>
        </div>
    </div>

    <!-- MODAL PERSONALIZADO ESTILO CROATA PARA CONFIRMACIONES Y ALERTAS -->
    <div class="evento-modal-overlay" id="modalCroataCustom" style="display: none;">
        <div class="croatian-modal-card">
            <h3 class="croatian-modal-title" id="croatianModalTitle">Obavijest / Aviso</h3>
            <p class="croatian-modal-text" id="croatianModalText">Texto del mensaje...</p>
            <div class="croatian-modal-buttons" id="croatianModalButtons"></div>
        </div>
    </div>

    <div class="container">
        <!-- Botón rojo interactivo de cambio de idioma -->
        <span id="badgeIdioma" class="badge-idioma" onclick="alternarIdioma()" title="Hacer clic para cambiar idioma">HR</span>

        <!-- Botón inteligente de Login / Logout (arriba a la derecha) -->
        <a href="#" class="btn-login-esquina" id="btnLoginLogout" onclick="manejarAccionLoginLogout(event)">
            🔑 <span id="textLogin">Prijava / Login</span>
        </a>

        <!-- Títulos solicitados -->
        <h1 id="tituloCroata">Dobrodošli u Malu školu</h1>
        <p class="sub-espanol" id="subEspanol">Bienvenidos a Malu školu</p>

        <!-- Bloque de botones central -->
        <div class="menu-grid">
            <!-- Botón de Clases de Idioma -->
            <button class="btn-menu-item" onclick="window.location.href='MS_Index1.html'">
                📚 <span id="textClases">Započni (Tečaj jezika) / Clases de Idioma</span>
            </button>

            <!-- Botón de Agenda -->
            <button class="btn-menu-item" onclick="window.location.href='MS_Agenda.html'">
                📅 <span id="textAgenda">Agenda / Agenda</span>
            </button>

            <!-- Botón de Actividades -->
            <button class="btn-menu-item" onclick="mostrarModalCroataCustom('Aktivnosti', 'Sección de Actividades en construcción / Aktivnosti su u izradi')">
                🎯 <span id="textActividades">Aktivnosti / Actividades</span>
            </button>
            
            <!-- NUEVO BOTÓN: El alma de Mala škola (en el lugar que marcaste en rojo) -->
            <button class="btn-menu-item" onclick="window.location.href='MS_Alma.html'">
                💙 <span id="textAlma">Duša Male škole / El alma de Mala škola</span>
            </button>

            <!-- Botón de Historia -->
            <button class="btn-menu-item full-width" onclick="mostrarModalCroataCustom('Povijest', 'Sección de Historia en construcción / Povijest je u izradi')">
                🏛️ <span id="textHistoria">Povijest / Historia</span>
            </button>
        </div>
    </div>

    <!-- Librería de Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Script de configuración, sesión y modales estilo croata -->
    <script>
        const SUPABASE_URL = 'https://pizswxittpzwwrymougc.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_s9U9C-8dCR3NfP3s6MEuhA_ADfGUXu8';
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let usuarioLogueadoActual = false;

        window.addEventListener('DOMContentLoaded', async () => {
            verificarIdiomaYTextos();
            await verificarSesionYAdaptarBoton();
            
            if (!sessionStorage.getItem('popupEventoVisto')) {
                await cargarProximoEventoPopup();
            }
        });

        function verificarIdiomaYTextos() {
            let idiomaElegido = localStorage.getItem('idiomaApp');
            if (!idiomaElegido) {
                idiomaElegido = 'hr-es';
                localStorage.setItem('idiomaApp', 'hr-es');
            }
            idiomaElegido = idiomaElegido.trim().toLowerCase();

            const subEspanol = document.getElementById('subEspanol');
            const textClases = document.getElementById('textClases');
            const badge = document.getElementById('badgeIdioma');
            const textActividades = document.getElementById('textActividades');
            const textAgenda = document.getElementById('textAgenda');
            const textAlma = document.getElementById('textAlma');
            const textHistoria = document.getElementById('textHistoria');

            if (idiomaElegido === 'hr') {
                badge.innerText = "HR";
                subEspanol.style.display = 'none';
                textClases.innerText = "Započni (Tečaj jezika)";
                textActividades.innerText = "Aktivnosti";
                textAgenda.innerText = "Agenda";
                textAlma.innerText = "Duša Male škole";
                textHistoria.innerText = "Povijest";
                document.getElementById('popupBadgeText').innerText = "🌟 Najbliže događanje";
                document.getElementById('popupBtnVerMas').innerText = "Vidi u agendi";
            } else {
                badge.innerText = "HR-ES";
                subEspanol.style.display = 'block';
                subEspanol.innerText = "Bienvenidos a Malu školu";
                textClases.innerText = "Započni (Tečaj jezika) / Clases de Idioma";
                textActividades.innerText = "Aktivnosti / Actividades";
                textAgenda.innerText = "Agenda / Agenda";
                textAlma.innerText = "Duša Male škole / El alma de Mala škola";
                textHistoria.innerText = "Povijest / Historia";
                document.getElementById('popupBadgeText').innerText = "🌟 Próximo Evento / Najbliže događanje";
                document.getElementById('popupBtnVerMas').innerText = "Ver en la Agenda / Vidi u agendi";
            }
        }

        async function verificarSesionYAdaptarBoton() {
            try {
                const { data: { session } } = await supabaseClient.auth.getSession();
                let idiomaElegido = (localStorage.getItem('idiomaApp') || 'hr-es').trim().toLowerCase();
                const textLogin = document.getElementById('textLogin');

                if (session && session.user) {
                    usuarioLogueadoActual = true;
                    const { data: perfil } = await supabaseClient
                        .from('perfiles')
                        .select('nombre')
                        .eq('id', session.user.id)
                        .single();

                    const nombreCorto = perfil && perfil.nombre ? perfil.nombre : "User";
                    
                    if (idiomaElegido === 'hr') {
                        textLogin.innerText = `Odjava (${nombreCorto})`;
                    } else {
                        textLogin.innerText = `Odjava / Logout (${nombreCorto})`;
                    }
                } else {
                    usuarioLogueadoActual = false;
                    if (idiomaElegido === 'hr') {
                        textLogin.innerText = "Prijava";
                    } else {
                        textLogin.innerText = "Prijava / Login";
                    }
                }
            } catch (err) {
                console.log("Error al verificar sesión:", err);
            }
        }

        async function manejarAccionLoginLogout(event) {
            event.preventDefault();
            let idiomaElegido = (localStorage.getItem('idiomaApp') || 'hr-es').trim().toLowerCase();

            if (usuarioLogueadoActual) {
                let tituloMsg = idiomaElegido === 'hr' ? "Odjava" : "Odjava / Logout";
                let textoMsg = idiomaElegido === 'hr' ? "Želite li se odjaviti iz sustava?" : "¿Deseas cerrar sesión en el sistema? / Želite li se odjaviti?";
                
                mostrarModalCroataConfirm(tituloMsg, textoMsg, async () => {
                    await supabaseClient.auth.signOut();
                    mostrarModalCroataCustom(
                        idiomaElegido === 'hr' ? "Uspjeh" : "Uspjeh / Éxito",
                        idiomaElegido === 'hr' ? "Uspješno ste se odjavili." : "Sesión cerrada correctamente. / Uspješno ste se odjavili.",
                        () => location.reload()
                    );
                });
            } else {
                sessionStorage.setItem('urlOrigen', window.location.href);
                window.location.href = 'MS_Login.html';
            }
        }

        function mostrarModalCroataCustom(titulo, texto, callbackCierre = null) {
            let idiomaElegido = (localStorage.getItem('idiomaApp') || 'hr-es').trim().toLowerCase();
            document.getElementById('croatianModalTitle').innerText = titulo;
            document.getElementById('croatianModalText').innerText = texto;
            
            const btnContenedor = document.getElementById('croatianModalButtons');
            let textoBtn = idiomaElegido === 'hr' ? "U redu" : "U redu / Entendido";
            
            btnContenedor.innerHTML = `<button class="croatian-btn-primary" id="btnCerrarModalCustom">${textoBtn}</button>`;
            document.getElementById('modalCroataCustom').style.display = 'flex';
            
            document.getElementById('btnCerrarModalCustom').onclick = () => {
                document.getElementById('modalCroataCustom').style.display = 'none';
                if (callbackCierre) callbackCierre();
            };
        }

        function mostrarModalCroataConfirm(titulo, texto, callbackSi) {
            let idiomaElegido = (localStorage.getItem('idiomaApp') || 'hr-es').trim().toLowerCase();
            document.getElementById('croatianModalTitle').innerText = titulo;
            document.getElementById('croatianModalText').innerText = texto;
            
            const btnContenedor = document.getElementById('croatianModalButtons');
            let txtSi = idiomaElegido === 'hr' ? "Da" : "Da / Sí";
            let txtNo = idiomaElegido === 'hr' ? "Odustani" : "Odustani / Cancelar";
            
            btnContenedor.innerHTML = `
                <button class="croatian-btn-secondary" id="btnModalNo">${txtNo}</button>
                <button class="croatian-btn-primary" id="btnModalSi">${txtSi}</button>
            `;
            document.getElementById('modalCroataCustom').style.display = 'flex';
            
            document.getElementById('btnModalNo').onclick = () => {
                document.getElementById('modalCroataCustom').style.display = 'none';
            };
            
            document.getElementById('btnModalSi').onclick = () => {
                document.getElementById('modalCroataCustom').style.display = 'none';
                if (callbackSi) callbackSi();
            };
        }

        async function cargarProximoEventoPopup() {
            try {
                const ahoraISO = new Date().toISOString();
                const { data, error } = await supabaseClient
                    .from('eventos')
                    .select('*')
                    .gte('fecha_hora', ahoraISO)
                    .order('fecha_hora', { ascending: true })
                    .limit(1);

                if (error) throw error;

                if (data && data.length > 0) {
                    const ev = data[0];
                    const idiomaActual = (localStorage.getItem('idiomaApp') || 'hr-es').trim().toLowerCase();
                    
                    let tituloFinal = ev.titulo_hr || "";
                    if (idiomaActual !== 'hr' && ev.titulo_es) {
                        tituloFinal = `${ev.titulo_hr} - ${ev.titulo_es}`;
                    }

                    const fechaLimpia = ev.fecha_hora.replace('Z', '');
                    const fechaFormateada = new Date(fechaLimpia).toLocaleString('es-ES', { 
                        day: 'numeric', 
                        month: 'long', 
                        year: 'numeric', 
                        hour: '2-digit', 
                        minute: '2-digit',
                        timeZone: 'UTC'
                    }) + " hs";

                    document.getElementById('popupTitulo').innerText = tituloFinal;
                    document.getElementById('popupFecha').innerText = fechaFormateada;
                    document.getElementById('popupLugar').innerText = ev.lugar ? `${ev.lugar} (${ev.asociacion || 'Mala škola'})` : (ev.asociacion || 'Mala škola');

                    document.getElementById('modalProximoEvento').style.display = 'flex';
                    sessionStorage.setItem('popupEventoVisto', 'true');
                }
            } catch (err) {
                console.log("No se pudo cargar el evento para el popup:", err);
            }
        }

        function cerrarPopupEmoji() {
            document.getElementById('modalProximoEvento').style.display = 'none';
        }

        function cerrarPopupEvento() {
            document.getElementById('modalProximoEvento').style.display = 'none';
        }

        function alternarIdioma() {
            let idiomaActual = (localStorage.getItem('idiomaApp') || 'hr').trim().toLowerCase();
            if (idiomaActual === "hr-es" || idiomaActual.includes("es")) {
                localStorage.setItem('idiomaApp', 'hr');
            } else {
                localStorage.setItem('idiomaApp', 'hr-es');
            }
            location.reload();
        }
    </script>
</body>
</html>
